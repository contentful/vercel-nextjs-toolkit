name: Node.js Package

on:
  push:
    branches: ['main']
  pull_request:
    types: [opened, synchronize]
    branches: ['main']

env:
  GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}

jobs:
  release:
    name: Release
    runs-on: ubuntu-latest
    permissions:
      contents: write # to be able to publish a GitHub release
      issues: write # to be able to comment on released issues
      pull-requests: write # to be able to comment on released pull requests
      id-token: write # to enable use of OIDC for npm provenance

    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Setup Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7
        with:
          node-version: 26
          registry-url: 'https://npm.pkg.github.com'
          scope: '@contentful'
          always-auth: true

      - run: npm ci
      - run: npm run build

      # Turbopack aliases `next/*` by the extensionless specifier, so `next/navigation.js`
      # breaks the App Router handler (#141). Fail if the build starts emitting the suffix again.
      - name: Check next/* imports are extensionless
        run: |
          if grep -rnE --include='*.js' --include='*.cjs' "[\"']next/[^\"']+\.js[\"']" dist; then
            echo "::error::dist imports next/* with a .js suffix. Keep next subpaths in rollupOptions.external."
            exit 1
          fi

      - run: npm test

      - name: Retrieve NPM Token
        if: github.event_name == 'push'
        id: vault
        uses: hashicorp/vault-action@892a26828f195e65540a40b4768ae4571f51ebfc # v4.0.0
        with:
          url: ${{ secrets.VAULT_URL }}
          role: ${{ github.event.repository.name }}-github-action
          method: jwt
          path: github-actions
          exportEnv: false
          secrets: |
            secret/data/github/github_packages_write GITHUB_PACKAGES_WRITE_TOKEN | GITHUB_PACKAGES_WRITE_TOKEN ;
            github/token/vercel-nextjs-toolkit-semantic-release token | GITHUB_TOKEN ;

      - name: Create GH .npmrc
        if: github.event_name == 'push'
        shell: bash
        run: |
          echo -e "//npm.pkg.github.com/:_authToken=${GITHUB_TOKEN}\n@contentful:registry=https://npm.pkg.github.com\nalways-auth=true" > .npmrc
        env:
          GITHUB_TOKEN: ${{ steps.vault.outputs.GITHUB_PACKAGES_WRITE_TOKEN }}

      - name: semantic-release
        if: github.event_name == 'push'
        run: npx semantic-release
        env:
          GITHUB_TOKEN: ${{ steps.vault.outputs.GITHUB_TOKEN }}
          NPM_TOKEN: ${{ steps.vault.outputs.GITHUB_PACKAGES_WRITE_TOKEN }}
